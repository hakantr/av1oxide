# av1oxide — AV1 video çözücü kütüphanesi (v0.1.0)
# Sıfır dış bağımlılık: `[dependencies]` bilinçli olarak boştur.

[package]
name = "av1oxide"
description = "100% stable-Rust AV1 video decoder reimplementing dav1d (8/10/12-bit, x86_64/aarch64/wasm32 SIMD, multithreaded, zero dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/av1oxide"
readme = "../../README.md"
keywords = ["av1", "video", "decoder", "codec", "dav1d"]
categories = ["multimedia::video", "multimedia::encoding"]
include = ["src/**", "examples/**", "Cargo.toml", "LICENSE"]

[lib]
name = "av1oxide"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]

# İsteğe bağlı derleme zamanı tanılama özellikleri (varsayılan kapalıdır).
[features]
msac-trace = []
profil = []
