# av1oxide — AV1 video ve AVIF görüntü çözücü kütüphanesi (v0.4.0)
# Sıfır üçüncü taraf medya/kodek bağımlılığı; yalnızca çekirdek sistem kütüphaneleri kullanılır.

[package]
name = "av1oxide"
description = "100% stable-Rust AV1 video and AVIF image decoder reimplementing dav1d, with libdav1d C-ABI (8/10/12-bit, SIMD, multithreaded, no external codec/media dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/av1oxide"
readme = "../../README.md"
keywords = ["av1", "avif", "video", "decoder", "dav1d"]
categories = ["multimedia::video", "multimedia::images", "multimedia::encoding"]
include = ["src/**", "examples/**", "include/**", "Cargo.toml", "LICENSE"]

[lib]
name = "av1oxide"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
crossbeam-utils.workspace = true
flate2 = { workspace = true, optional = true }
indexmap.workspace = true
memchr.workspace = true
rustc-hash.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true, optional = true }

# Özellik yapılandırması: varsayılan `std` açıktır; `--no-default-features` ile `#![no_std] + alloc` derlenir.
[features]
default = ["std"]
std = ["crossbeam-utils/std", "dep:flate2", "dep:parking_lot"]
capi = ["std"]
msac-trace = ["std"]
profil = ["std"]
