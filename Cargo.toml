[workspace]
resolver = "3"
members = [
    "crates/av1oxide",
    "crates/av1oxide-image",
]
exclude = [
    ".cache",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.100.0"
license = "BSD-2-Clause"
repository = "https://github.com/hakantr/av1oxide"

[workspace.dependencies]
av1oxide = { path = "crates/av1oxide", version = "0.4.0" }
crossbeam-utils = { version = "0.8", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
indexmap = { version = "2", default-features = false }
memchr = { version = "2", default-features = false }
parking_lot = { version = "0.12", default-features = false }
rustc-hash = { version = "2", default-features = false }

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_imports = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
incremental = false

[profile.robust]
inherits = "release"
overflow-checks = true
debug-assertions = true

[profile.profilleme]
inherits = "release"
debug = 1
strip = "none"
