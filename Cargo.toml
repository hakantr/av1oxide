[workspace]
resolver = "3"
members = [
    "crates/av1oxide",
]
exclude = [
    ".cache",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.100.0"
license = "BSD-2-Clause"
repository = "https://github.com/hakantr/av1oxide"

[workspace.dependencies]
crossbeam-utils = { version = "0.8", default-features = false, features = ["std"] }
memchr = { version = "2", default-features = false }
parking_lot = { version = "0.12", default-features = false }
rustc-hash = { version = "2", default-features = false }

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[profile.robust]
inherits = "release"
overflow-checks = true
debug-assertions = true
