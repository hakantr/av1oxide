name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-docs:
    name: Format, Clippy & Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Verify zero mod.rs files
        run: test -z "$(git ls-files '*mod.rs')"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, all-targets, all-features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (av1oxide no_std + alloc)
        run: cargo clippy --locked -p av1oxide --no-default-features -- -D warnings
      - name: Rustdoc (workspace, all-features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --all-features --no-deps

  test-linux-x86_64:
    name: Linux x86_64 Tests (std, no_std & C-ABI Prefix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - name: Release test suite (workspace, all-features)
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo test --locked --release --workspace --all-features
      - name: Release unit tests (av1oxide no_std + alloc)
        run: cargo test --locked --release -p av1oxide --no-default-features --lib
      - name: Verify documented C-ABI prefix install, SONAME, 19 symbols, and dynamic C link
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/dav1d-prefix"
          cargo run --locked --release -p av1oxide --example install_capi_prefix -- "${PREFIX}"
          PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig" pkg-config --modversion --cflags --libs dav1d
          test "$(PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig" pkg-config --modversion dav1d)" = "1.5.4"
          readelf -d "${PREFIX}/lib/libdav1d.so.7" | grep -F '(SONAME)' | grep -F '[libdav1d.so.7]'
          SYM_COUNT=$(nm -D --defined-only "${PREFIX}/lib/libdav1d.so.7" | awk '{print $NF}' | grep -E '^dav1d_' | sort -u | wc -l)
          test "${SYM_COUNT}" -eq 19

  test-macos-arm64:
    name: macOS ARM64 Tests & C-ABI Prefix
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - name: Release test suite (workspace, all-features)
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo test --locked --release --workspace --all-features
      - name: Verify documented C-ABI prefix install, install_name, and 19 symbols
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/dav1d-prefix"
          cargo run --locked --release -p av1oxide --example install_capi_prefix -- "${PREFIX}"
          test "$(otool -D "${PREFIX}/lib/libdav1d.7.dylib" | tail -n 1)" = "@rpath/libdav1d.7.dylib"
          SYM_COUNT=$(nm -gU "${PREFIX}/lib/libdav1d.7.dylib" | awk '{print $NF}' | sed 's/^_//' | grep -E '^dav1d_' | sort -u | wc -l)
          test "${SYM_COUNT}" -eq 19

  wasm-and-cross:
    name: WebAssembly & Cross-Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: >-
            wasm32-wasip1,
            wasm32-unknown-unknown,
            armv7-unknown-linux-gnueabihf,
            riscv64gc-unknown-linux-gnu,
            loongarch64-unknown-linux-gnu,
            powerpc64le-unknown-linux-gnu
      - name: Install wabt (wasm-validate, wasm-objdump)
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Build, validate, disassemble, and execute linked scalar vs simd128 .wasm binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-wasip1 -p av1oxide --example decode_ivf
          cp target/wasm32-wasip1/release/examples/decode_ivf.wasm target/wasm32-wasip1/scalar.wasm

          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build --locked --release --target wasm32-wasip1 -p av1oxide --example decode_ivf
          cp target/wasm32-wasip1/release/examples/decode_ivf.wasm target/wasm32-wasip1/simd128.wasm

          wasm-validate --disable-simd target/wasm32-wasip1/scalar.wasm
          if wasm-validate --disable-simd target/wasm32-wasip1/simd128.wasm; then
            echo "ERROR: simd128.wasm unexpectedly passed wasm-validate --disable-simd" >&2
            exit 1
          fi

          wasm-objdump -d target/wasm32-wasip1/scalar.wasm > target/wasm32-wasip1/scalar.disasm
          wasm-objdump -d target/wasm32-wasip1/simd128.wasm > target/wasm32-wasip1/simd128.disasm

          SCALAR_SIMD_COUNT=$(grep -cE '\b(v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2)\.' target/wasm32-wasip1/scalar.disasm || true)
          SIMD_COUNT=$(grep -cE '\b(v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2)\.' target/wasm32-wasip1/simd128.disasm || true)
          echo "scalar SIMD instructions: ${SCALAR_SIMD_COUNT}"
          echo "simd128 SIMD instructions: ${SIMD_COUNT}"
          test "${SCALAR_SIMD_COUNT}" -eq 0
          test "${SIMD_COUNT}" -gt 0

          SAMPLE_IVF="crates/av1oxide/tests/fixtures/streams/Syntax_AV1_mainb8ss420_432x240_002_vq_aom_ctest_4.2.stripped.ivf"
          run_wasi() {
            node --input-type=module -e '
              import fs from "node:fs";
              import { WASI } from "node:wasi";
              const [wasmPath, ivfPath] = process.argv.slice(1);
              const wasi = new WASI({
                version: "preview1",
                args: ["decode_ivf.wasm", "--md5", ivfPath],
                preopens: { ".": process.cwd() },
              });
              const mod = await WebAssembly.compile(fs.readFileSync(wasmPath));
              const inst = await WebAssembly.instantiate(mod, wasi.getImportObject());
              wasi.start(inst);
            ' "$1" "$2"
          }
          OUT_SCALAR=$(run_wasi target/wasm32-wasip1/scalar.wasm "${SAMPLE_IVF}")
          OUT_SIMD=$(run_wasi target/wasm32-wasip1/simd128.wasm "${SAMPLE_IVF}")
          echo "scalar output:  ${OUT_SCALAR}"
          echo "simd128 output: ${OUT_SIMD}"
          test "${OUT_SCALAR}" = "${OUT_SIMD}"
          test "${OUT_SCALAR}" = "frames=10 dims=432x240 md5=a9249d720bf9a7dcddce9e358e9aa967"
      - name: Check wasm32-unknown-unknown (no_std + alloc)
        run: cargo check --locked -p av1oxide --no-default-features --target wasm32-unknown-unknown
      - name: Check secondary architectures (armv7, riscv64gc, loongarch64, powerpc64le)
        run: |
          cargo check --locked -p av1oxide --target armv7-unknown-linux-gnueabihf
          cargo check --locked -p av1oxide --target riscv64gc-unknown-linux-gnu
          cargo check --locked -p av1oxide --target loongarch64-unknown-linux-gnu
          cargo check --locked -p av1oxide --target powerpc64le-unknown-linux-gnu

  miri:
    name: Miri Core Safety Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on safe core modules
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: |
          cargo +nightly miri test --locked -p av1oxide --lib bitstream::
          cargo +nightly miri test --locked -p av1oxide --lib entropy::
          cargo +nightly miri test --locked -p av1oxide --lib container::
          cargo +nightly miri test --locked -p av1oxide --lib frame::butce::
          cargo +nightly miri test --locked -p av1oxide --lib thread::
